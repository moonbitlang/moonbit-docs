name: upload llm.txt

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Language to publish
        type: choice
        options: [all, en, zh]
        default: all
      source_ref:
        description: Optional source branch or release tag
        type: string
      target:
        description: Chinese deployment destination
        type: choice
        options: [aws, both, aliyun]
        default: aws
      aws_account:
        description: AWS account to publish (both keeps the rollback copy current)
        type: choice
        options: [legacy, moonbit, both]
        default: legacy

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: next

jobs:
  llm-upload-en:
    if: inputs.locale != 'zh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -r requirements.txt
      - name: build
        run: make markdown
      - name: compilation
        id: compilation
        run: python3 llm.py
      - name: Upload English llms.txt to legacy AWS
        if: inputs.aws_account != 'moonbit'
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
        run: |
          aws s3 cp ./_build/markdown/llm.md ${{secrets.AWS_HOMEPAGE_BUCKET}}/llms.txt
          aws cloudfront create-invalidation --distribution-id ${{secrets.AWS_CLOUDFRONT_HOMEPAGE_DISTRIBUTION_ID}} --paths "/llms.txt"
      - name: Authenticate to MoonBit AWS
        id: moonbit-credentials
        if: ${{ !cancelled() && steps.compilation.outcome == 'success' && (inputs.aws_account == 'moonbit' || inputs.aws_account == 'both') }}
        uses: aws-actions/configure-aws-credentials@v4
        env:
          # Register the action's opaque role identifier for runner log masking.
          MASKED_ROLE_ID: ${{ secrets.AWS_MOONBIT_ROLE_ID }}
        with:
          role-to-assume: ${{ secrets.AWS_MOONBIT_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.AWS_MOONBIT_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Upload English llms.txt to MoonBit AWS
        if: ${{ !cancelled() && steps.moonbit-credentials.outcome == 'success' }}
        env:
          BUCKET: ${{ secrets.AWS_MOONBIT_EN_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.AWS_MOONBIT_EN_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 cp ./_build/markdown/llm.md "s3://$BUCKET/llms.txt" --content-type 'text/plain; charset=utf-8' --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/llms.txt" --query 'Invalidation.Status' --output text

  llm-upload-zh:
    if: inputs.locale != 'en'
    concurrency:
      group: publish-homepage-cn-llms
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -r requirements.txt
      - name: build
        run: LANGUAGE="zh_CN" make markdown
      - name: compilation
        id: compilation
        run: python3 llm.py
      - uses: aliyun/setup-aliyun-cli-action@v1
        if: inputs.target == 'aliyun' || inputs.target == 'both'
      - name: upload
        if: inputs.target == 'aliyun' || inputs.target == 'both'
        run: |
          aliyun configure set --profile default --mode AK --access-key-id ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_ID}} --access-key-secret ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET}} --region ${{secrets.ALIBABA_REGION}}
          echo y | aliyun oss cp ./_build/markdown/llm.md ${{secrets.ALIYUN_HOMEPAGE_BUCKET}}/llms.txt
          aliyun cdn RefreshObjectCaches --ObjectPath https://www.moonbitlang.cn/llms.txt --ObjectType File
      - name: Upload Chinese llms.txt to AWS
        if: ${{ !cancelled() && steps.compilation.outcome == 'success' && inputs.target != 'aliyun' && inputs.aws_account != 'moonbit' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
          BUCKET: ${{ vars.AWS_CN_HOMEPAGE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.AWS_CN_HOMEPAGE_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 cp ./_build/markdown/llm.md "s3://$BUCKET/llms.txt" --content-type 'text/plain; charset=utf-8' --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/llms.txt"
      - name: Authenticate to MoonBit AWS
        id: moonbit-credentials
        if: ${{ !cancelled() && steps.compilation.outcome == 'success' && (inputs.aws_account == 'moonbit' || inputs.aws_account == 'both') && inputs.target != 'aliyun' }}
        uses: aws-actions/configure-aws-credentials@v4
        env:
          # Register the action's opaque role identifier for runner log masking.
          MASKED_ROLE_ID: ${{ secrets.AWS_MOONBIT_ROLE_ID }}
        with:
          role-to-assume: ${{ secrets.AWS_MOONBIT_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.AWS_MOONBIT_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Upload Chinese llms.txt to MoonBit AWS
        if: ${{ !cancelled() && steps.moonbit-credentials.outcome == 'success' }}
        env:
          BUCKET: ${{ secrets.AWS_MOONBIT_CN_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.AWS_MOONBIT_CN_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 cp ./_build/markdown/llm.md "s3://$BUCKET/llms.txt" --content-type 'text/plain; charset=utf-8' --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/llms.txt" --query 'Invalidation.Status' --output text

