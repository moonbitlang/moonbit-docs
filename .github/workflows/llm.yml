name: upload llm.txt

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Language to publish
        type: choice
        options: [all, en, zh]
        default: all
      source_ref:
        description: Source ref (Chinese requires a stable tag such as v0.10.20)
        type: string

defaults:
  run:
    working-directory: next

jobs:
  llm-upload-en:
    if: inputs.locale != 'zh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements.txt
      - name: build
        run: make markdown
      - name: compilation
        run: python3 llm.py
      - name: upload
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_MOONBIT_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_MOONBIT_SECRET_ACCESS_KEY}}
          AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
          BUCKET: ${{ secrets.AWS_MOONBIT_EN_BUCKET }}
        run: |
          aws s3 cp ./_build/markdown/llm.md "s3://$BUCKET/llms.txt" --content-type 'text/plain; charset=utf-8' --only-show-errors
          aws cloudfront create-invalidation --distribution-id ${{secrets.AWS_MOONBIT_EN_DISTRIBUTION_ID}} --paths "/llms.txt" --query 'Invalidation.Status' --output text

  llm-upload-zh:
    if: inputs.locale != 'en'
    concurrency:
      group: publish-homepage-cn-llms
      cancel-in-progress: false
    env:
      DOCS_RELEASE: ${{ inputs.source_ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Chinese stable source tag
        working-directory: ${{ github.workspace }}
        run: '[[ "$DOCS_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements.txt
      - name: build
        run: LANGUAGE="zh_CN" make markdown
      - name: compilation
        id: compilation
        run: LANGUAGE="zh_CN" python3 llm.py
      - uses: aliyun/setup-aliyun-cli-action@v1
      - name: Upload Chinese llms.txt to OSS and refresh ESA
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          BUCKET: ${{ secrets.ALIYUN_HOMEPAGE_BUCKET }}
          ESA_SITE_ID: ${{ vars.ALIYUN_ESA_SITE_ID }}
        run: |
          test -n "$BUCKET" && test -n "$ESA_SITE_ID"
          aliyun configure set --profile default --mode AK --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" --region cn-hangzhou
          aliyun oss cp ./_build/markdown/llm.md "$BUCKET/llms.txt" --endpoint oss-cn-shenzhen.aliyuncs.com --force --meta 'Content-Type:text/plain; charset=utf-8'
          aliyun esa PurgeCaches --region cn-hangzhou --SiteId "$ESA_SITE_ID" --Type file --Content '{"Files":["https://www.moonbitlang.cn/llms.txt","https://moonbitlang.cn/llms.txt"]}'
