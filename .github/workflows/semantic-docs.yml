name: semantic documentation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/actions/setup/**
      - .github/workflows/semantic-docs.yml
      - justfile
      - next/**
      - scripts/build_semantic_snapshot.py
      - scripts/moonbit_semantic/**
      - tests/semantic_docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MoonBit ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: pinned
            version: "0.1.20260629"
          - channel: current
            version: latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: next/requirements.txt

      - name: Install Python tools
        run: python -m pip install uv

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install MoonBit
        uses: ./.github/actions/setup
        with:
          version: ${{ matrix.version }}

      - name: Restore MoonBit dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/.mooncakes
          key: semantic-mooncakes-${{ runner.os }}-${{ matrix.version }}-${{ hashFiles('next/sources/**/moon.mod.json', 'next/sources/**/moon.mod', 'next/sources/**/moon.pkg.json') }}
          restore-keys: |
            semantic-mooncakes-${{ runner.os }}-${{ matrix.version }}-

      - name: Run semantic documentation unit tests
        run: uv run --with-requirements next/requirements.txt --with pytest pytest -q tests/semantic_docs

      - name: Verify ordinary HTML fallback without a snapshot
        run: just docs-html

      - name: Build strict semantic HTML
        run: just docs-html-semantic

      - name: Run semantic documentation integration checks
        env:
          MOONBIT_SEMANTIC_E2E: "1"
          MOONBIT_SEMANTIC_SNAPSHOT: semantic-snapshot
          MOONBIT_SEMANTIC_HTML: next/_build/html
        run: uv run --with-requirements next/requirements.txt python -m unittest discover -s tests/semantic_docs -p 'test_integration*.py' -v

      - name: Upload semantic snapshot and HTML
        uses: actions/upload-artifact@v4
        with:
          name: semantic-docs-${{ matrix.channel }}
          path: |
            semantic-snapshot
            next/_build/html
          if-no-files-found: error
          retention-days: 7
