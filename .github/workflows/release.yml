name: release website

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (for example v0.10.14)
        required: true
        type: string
      target:
        description: Chinese deployment destination
        type: choice
        options: [both, aws, aliyun]
        default: both

defaults:
  run:
    working-directory: next

jobs:
  zh-build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: publish-docs-cn
      cancel-in-progress: false
    env:
      DOCS_RELEASE: ${{ inputs.release_tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        working-directory: ${{ github.workspace }}
        run: '[[ "$DOCS_RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-python@v5
      - name: install
        run: pip install -r requirements.txt
      - name: build
        run: |
          LANGUAGE="zh_CN" python3 llm.py
          LANGUAGE="zh_CN" make html
      - uses: aliyun/setup-aliyun-cli-action@v1
        if: inputs.target != 'aws'
      - name: upload
        if: inputs.target != 'aws'
        run: |
          aliyun configure set --profile default --mode AK --access-key-id ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_ID}} --access-key-secret ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET}} --region ${{secrets.ALIBABA_REGION}}
          aliyun oss sync ./_build/html/ ${{secrets.ALIYUN_OSS_BUCKET}} --force --delete
          aliyun cdn RefreshObjectCaches --ObjectPath https://docs.moonbitlang.cn/ --ObjectType Directory
      - name: Upload Chinese documentation to AWS
        if: inputs.target != 'aliyun'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
          BUCKET: ${{ vars.AWS_CN_DOCS_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.AWS_CN_DOCS_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 sync ./_build/html/ "s3://$BUCKET" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
