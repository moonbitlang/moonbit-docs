name: check document examples

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/actions/setup/**
      - .github/workflows/next-check.yml
      - .github/workflows/release.yml
      - .readthedocs.yaml
      - justfile
      - next/**
      - scripts/build_semantic_snapshot.py
      - scripts/moonbit_semantic/**
      - tests/semantic_docs/**
  schedule:
    - cron: "0 10 * * 2"

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Check semantic JSON-RPC transport
        run: python -m unittest discover -s tests/semantic_docs -p 'test_indexer.py' -k json_rpc -v

      - name: Install semantic documentation tools
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install uv

      - name: Install just
        if: matrix.os == 'ubuntu-latest'
        uses: extractions/setup-just@v3

      - name: moon check and test
        run: |
          python scripts/check-document.py

      - name: check error-code examples
        env:
          CHECK_ERROR_DOCS_ALLOW_TOOLCHAIN_DRIFT: "1"
        run: |
          python next/check_error_docs.py all

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install scrut
        run: cargo install --locked scrut

      - name: Workspace command transcript
        shell: bash
        run: scrut test --shell bash next/sources/workspace/workspace.cram

      - name: Script mode command transcript
        shell: bash
        run: scrut test --shell bash next/sources/script-mode/script-mode.cram

      - name: Check semantic documentation
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run --with-requirements next/requirements.txt --with pytest pytest -q tests/semantic_docs
          just docs-html
          MOONBIT_SEMANTIC_E2E=1 MOONBIT_SEMANTIC_TARGET_E2E=1 MOONBIT_SEMANTIC_SNAPSHOT=semantic-snapshot MOONBIT_SEMANTIC_HTML=next/_build/html uv run --with-requirements next/requirements.txt python -m unittest discover -s tests/semantic_docs -p 'test_integration*.py' -v
