name: check document examples

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - next/**
      - .github/workflows/next-check.yml
  schedule:
    - cron: "0 10 * * 2"

jobs:
  validation:
    name: validation (${{ matrix.os }}, ${{ matrix.version }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        version:
          - nightly
          - pre-release
    runs-on: ${{ matrix.os }}
    env:
      SCRUT_VERSION: "0.5.1"
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup
        with:
          version: ${{ matrix.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: moon check and test
        run: |
          python scripts/check-document.py

      - name: check error-code examples
        if: always()
        run: |
          python next/check_error_docs.py all

      - name: Cache scrut
        if: always()
        id: scrut-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scrut
          key: scrut-${{ matrix.os }}-${{ runner.arch }}-${{ env.SCRUT_VERSION }}-v1

      - name: Set up Rust
        if: always() && steps.scrut-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install scrut
        if: always() && steps.scrut-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version "$env:SCRUT_VERSION" --root "${{ runner.temp }}/scrut" scrut
        shell: pwsh

      - name: Add scrut to PATH
        if: always()
        shell: pwsh
        run: '"${{ runner.temp }}/scrut/bin" >> $env:GITHUB_PATH'

      - name: Workspace command transcript
        if: always()
        shell: bash
        run: scrut test --shell bash next/sources/workspace/workspace.cram

      - name: Script mode command transcript
        if: always()
        shell: bash
        run: scrut test --shell bash next/sources/script-mode/script-mode.cram
