name: check document examples

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - next/**
      - .github/workflows/next-check.yml
  schedule:
    - cron: "0 10 * * 2"

jobs:
  validation:
    name: validation (${{ matrix.os }}, ${{ matrix.version }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        version:
          - nightly
          - pre-release
    runs-on: ${{ matrix.os }}
    env:
      SCRUT_VERSION: "0.5.1"
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup
        with:
          version: ${{ matrix.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scrut-${{ env.SCRUT_VERSION }}
          cache-targets: false
          cache-on-failure: true

      - name: Install scrut
        shell: bash
        run: cargo install --locked --version "$SCRUT_VERSION" scrut

      - name: moon check and test
        run: |
          python scripts/check-document.py

      - name: check error-code examples
        run: |
          python next/check_error_docs.py all

      - name: Workspace command transcript
        shell: bash
        run: scrut test --shell bash next/sources/workspace/workspace.cram

      - name: Script mode command transcript
        shell: bash
        run: scrut test --shell bash next/sources/script-mode/script-mode.cram
