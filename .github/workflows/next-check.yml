name: check document examples

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - next/**
  schedule:
    - cron: "0 10 * * 2"

jobs:
  compatibility:
    name: compatibility (${{ matrix.os }}, ${{ matrix.version }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        version:
          - nightly
          - pre-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup
        with:
          version: ${{ matrix.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: moon check and test
        run: |
          python scripts/check-document.py

      - name: check error-code examples
        if: always()
        run: |
          python next/check_error_docs.py all

  transcripts:
    name: transcripts (${{ matrix.os }}, nightly)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install
        uses: ./.github/actions/setup
        with:
          version: nightly

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install scrut
        run: cargo install --locked scrut

      - name: Workspace command transcript
        shell: bash
        run: scrut test --shell bash next/sources/workspace/workspace.cram

      - name: Script mode command transcript
        shell: bash
        run: scrut test --shell bash next/sources/script-mode/script-mode.cram
