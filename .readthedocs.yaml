version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  jobs:
    post_install:
      - curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "0.1.20260629"
      - PATH="$HOME/.moon/bin:$PATH" moon update
    pre_build:
      - cd next && python3 llm.py && cd ..
      - PATH="$HOME/.moon/bin:$PATH" python3 scripts/build_semantic_snapshot.py build --repo-root . --output semantic-snapshot
      - python3 scripts/build_semantic_snapshot.py validate --snapshot semantic-snapshot --require-semantics --require-external-definitions

sphinx:
  configuration: next/conf.py

python:
  install:
  - requirements: next/requirements.txt

formats:
  - epub
  - pdf
